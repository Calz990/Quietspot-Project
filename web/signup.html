<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuietSpot – Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('qs-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">

<!-- ===== TOP BAR / NAVIGATION ===== -->
<header class="bar">
  <div class="in">
    <div class="logo"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>QuietSpot</div>
    <nav class="main" aria-label="Main menu">
      <button class="pill" data-act="go" data-page="home">Home</button>
      <button class="pill" data-act="go" data-page="feed">Feed</button>
      <button class="pill" data-act="go" data-page="reco">Reco</button>
      <button class="pill" data-act="go" data-page="spots">Spots</button>
      <button class="pill" data-act="go" data-page="dash">Dashboard</button>
    </nav>
    <span class="chip" id="whoChip"></span>
    <button class="btn sm" id="authBtn" data-act="go" data-page="login">Login</button>
    <select class="palette" id="palette" aria-label="Color palette">
      <option value="bw">Black &amp; White</option>
      <option value="teal">Teal &amp; Navy</option>
      <option value="blue">Blue &amp; Cream</option>
      <option value="sage">Sage &amp; Brown</option>
      <option value="sunset">Sunset Orange</option>
      <option value="violet">Violet &amp; Pink</option>
      <option value="ocean">Ocean Blue</option>
      <option value="rose">Rose &amp; Teal</option>
    </select>
    <button class="theme" id="themeBtn" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="track"><span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </span></span>
      <span id="themeLabel">Light</span>
    </button>
    <button class="iconbtn" data-act="go" data-page="about" aria-label="About this system">i</button>
  </div>
</header>

<!-- ===== SIGN UP PAGE ===== -->
<section class="page" id="p-signup">
  <div class="wrap authwrap"><form class="card authform" id="signupForm" novalidate>
    <h2>Sign Up to QuietSpot</h2>
    <input type="text" id="s-name" placeholder="Full Name" aria-label="Full Name"><input type="text" id="s-user" placeholder="Username" aria-label="Username"><input type="text" id="s-mail" placeholder="Email" aria-label="Email"><input type="password" id="s-pass" placeholder="Password (6+ characters)" aria-label="Password">
    <p class="err" id="sErr" role="alert"></p>
    <button type="submit" class="btn solid">Sign Up</button>
    <button type="button" class="btn" data-act="go" data-page="login">Login</button><button type="button" class="btn" data-act="go" data-page="home">Back To Home</button>
  </form></div>
</section>

<!-- ===== TOAST (small message popup) ===== -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/script.js"></script>
</body>
</html>
