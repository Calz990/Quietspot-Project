<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuietSpot – Real-Time Study Area Tracker and Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('qs-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

<header class="bar">
  <div class="in">
    <div class="logo"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>QuietSpot</div>
    <nav class="main" aria-label="Main menu">
      <button class="pill" data-act="go" data-page="home" aria-current="page">Home</button>
      <button class="pill" data-act="go" data-page="feed">Feed</button>
      <button class="pill" data-act="go" data-page="reco">Reco</button>
      <button class="pill" data-act="go" data-page="spots">Spots</button>
      <button class="pill" data-act="go" data-page="dash">Dashboard</button>
    </nav>
    <span class="chip" id="whoChip"></span>
    <button class="btn sm" id="authBtn" data-act="go" data-page="login">Login</button>
    <select class="palette" id="palette" aria-label="Color palette">
      <option value="bw">Black &amp; White</option>
      <option value="teal">Teal &amp; Navy</option>
      <option value="blue">Blue &amp; Cream</option>
      <option value="sage">Sage &amp; Brown</option>
      <option value="sunset">Sunset Orange</option>
      <option value="violet">Violet &amp; Pink</option>
      <option value="ocean">Ocean Blue</option>
      <option value="rose">Rose &amp; Teal</option>
    </select>
    <button class="theme" id="themeBtn" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="track"><span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </span></span>
      <span id="themeLabel">Light</span>
    </button>
    <button class="iconbtn" data-act="go" data-page="about" aria-label="About this system">i</button>
  </div>
</header>

<!-- HOME -->
<section class="page" id="p-home">
  <div class="hero">
    <div class="copy">
      <h1>Find a quiet place to study, right now.</h1>
      <p class="lead">See live seats, noise, and crowd levels for study spots around Alangilan, Batangas City.</p>
      <div class="cta">
        <button class="btn inv" data-act="go-search">Find a spot</button>
        <button class="btn ghost" data-act="go-report">Report status</button>
        <button class="btn ghost" data-act="go-add">Add a spot</button>
      </div>
      <div class="waiting" id="waiting"></div>
    </div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 440 380" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <ellipse cx="220" cy="348" rx="120" ry="14" fill="var(--ink)" stroke="none" opacity=".12"/>
        <path d="M220 330C140 250 100 200 100 142a120 120 0 0 1 240 0c0 58-40 108-120 188Z" fill="var(--surface)"/>
        <rect x="150" y="96" width="140" height="92" rx="12" fill="var(--ink)" stroke="none"/>
        <rect x="174" y="150" width="20" height="22" rx="3" fill="var(--on-ink)" stroke="none"/>
        <rect x="210" y="128" width="20" height="44" rx="3" fill="var(--on-ink)" stroke="none" opacity=".6"/>
        <rect x="246" y="108" width="20" height="64" rx="3" fill="var(--on-ink)" stroke="none" opacity=".3"/>
        <rect x="268" y="262" width="150" height="62" rx="12" fill="var(--surface)"/>
        <path d="M288 284h74M288 304h48"/>
        <circle cx="394" cy="294" r="12" fill="var(--ink)" stroke="none"/>
        <path d="M30 70c16 10 16 30 0 40M52 58c26 18 26 54 0 72" opacity=".5"/>
        <path d="M18 60 70 138" stroke-width="6"/>
      </svg>
    </div>
  </div>
</section>

<!-- TOAST -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/script.js"></script>
</body>
</html>
