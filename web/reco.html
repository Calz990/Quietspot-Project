<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuietSpot – Reco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('qs-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reco">

<!-- ===== TOP BAR / NAVIGATION ===== -->
<header class="bar">
  <div class="in">
    <div class="logo"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>QuietSpot</div>
    <nav class="main" aria-label="Main menu">
      <button class="pill" data-act="go" data-page="home">Home</button>
      <button class="pill" data-act="go" data-page="feed">Feed</button>
      <button class="pill" data-act="go" data-page="reco" aria-current="page">Reco</button>
      <button class="pill" data-act="go" data-page="spots">Spots</button>
      <button class="pill" data-act="go" data-page="dash">Dashboard</button>
    </nav>
    <span class="chip" id="whoChip"></span>
    <button class="btn sm" id="authBtn" data-act="go" data-page="login">Login</button>
    <select class="palette" id="palette" aria-label="Color palette">
      <option value="bw">Black &amp; White</option>
      <option value="teal">Teal &amp; Navy</option>
      <option value="blue">Blue &amp; Cream</option>
      <option value="sage">Sage &amp; Brown</option>
      <option value="sunset">Sunset Orange</option>
      <option value="violet">Violet &amp; Pink</option>
      <option value="ocean">Ocean Blue</option>
      <option value="rose">Rose &amp; Teal</option>
    </select>
    <button class="theme" id="themeBtn" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="track"><span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </span></span>
      <span id="themeLabel">Light</span>
    </button>
    <button class="iconbtn" data-act="go" data-page="about" aria-label="About this system">i</button>
  </div>
</header>

<!-- ===== RECO PAGE ===== -->
<section class="page" id="p-reco">
  <div class="wrap feedwrap">
    <div class="head"><div><h2>Recommendations</h2><p>Tick what you need and we rank the best spots for you</p></div></div>
    <div class="card" style="padding:16px"><div class="checks" id="recoChecks" style="margin:0"></div></div>
    <div id="recoOut" class="feed" style="margin-top:18px"></div>
  </div>
</section>

<!-- ===== DIALOGS / POPUPS ===== -->
<dialog id="dlgSpot" class="wide"><div class="dlg">
  <div id="dTop"></div><div id="dPhotos"></div><div id="dReports"></div>
  <div class="foot"><button class="btn" data-close>Close</button></div>
</div></dialog>

<dialog id="dlgPhoto" class="wide"><div class="dlg lightbox">
  <img id="lbImg" alt="">
  <p class="meta" id="lbCap" style="margin-top:10px"></p>
  <div class="foot"><button class="btn" data-close>Close</button></div>
</div></dialog>

<dialog id="dlgReport"><form class="dlg" id="reportForm" novalidate></form></dialog>

<dialog id="dlgAdd"><form class="dlg" id="addForm" novalidate>
  <h2>Add or recommend a study spot</h2>
  <p class="sub">The pin is placed at your current location on the map. New spots show as unverified until others confirm them.</p>
  <div class="fgrid">
    <label class="f">Name<input type="text" id="a-name" maxlength="60"></label>
    <label class="f">Type<select id="a-type"><option value="Cafe">Café</option><option value="Library">Library</option><option value="StudyRoom">Study room</option><option value="CoworkingSpace">Co-working space</option></select></label>
    <label class="f full">Landmark or address<input type="text" id="a-addr" maxlength="90"></label>
    <label class="f">Opens<select id="a-open"></select></label>
    <label class="f">Closes<select id="a-close"></select></label>
    <label class="f">Total seats<input type="number" id="a-cap" value="20"></label>
    <label class="f">Open seats now<input type="number" id="a-seats" value="10"></label>
    <label class="f">Price in ₱ (0 if free)<input type="number" id="a-price" value="0"></label>
    <label class="f">Wi-Fi speed in Mbps (0 if none)<input type="number" id="a-mbps" value="0"></label>
    <label class="f">Noise level now<select id="a-noise"><option value="1">Quiet</option><option value="2" selected>Moderate</option><option value="3">Loud</option></select></label>
    <label class="f">Crowd level now<select id="a-crowd"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option></select></label>
    <div class="full checks" style="margin:0">
      <label><input type="checkbox" id="a-outlets"> Power outlets</label>
      <label><input type="checkbox" id="a-aircon"> Air-conditioning</label>
      <label><input type="checkbox" id="a-food"> Food available</label>
    </div>
    <label class="f full">Description of the place (optional)<textarea id="a-desc" maxlength="240" rows="2" placeholder="What is it like? Who is it good for?"></textarea></label>
    <label class="f full">House rules (optional)<textarea id="a-rules" maxlength="160" rows="2"></textarea></label>
  </div>
  <p class="err" id="addErr" role="alert"></p>
  <div class="foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn solid">Add study spot</button></div>
</form></dialog>

<!-- ===== TOAST (small message popup) ===== -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/script.js"></script>
</body>
</html>
